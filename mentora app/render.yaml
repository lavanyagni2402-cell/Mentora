# Render Blueprint: Dashboard → New → Blueprint → pick this GitHub repo.
# Creates the PostgreSQL database, the ML service and the main web app.
databases:
  - name: mentora-db
    plan: free
    databaseName: mentora
    user: mentora

services:
  - type: web
    name: mentora-ml
    runtime: python
    plan: free
    rootDir: ml
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT

  - type: web
    name: mentora
    runtime: node
    plan: free
    buildCommand: cd client && npm install --include=dev && npm run build && cd ../server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: mentora-db, property: connectionString }
      - key: ML_URL
        fromService: { name: mentora-ml, type: web, property: hostport }
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
